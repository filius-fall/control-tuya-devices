services:
  tuya-exporter:
    build: .
    container_name: tuya-exporter
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - TUYA_POLL_INTERVAL=30
      - TUYA_DISCOVER_INTERVAL=3600
      - TUYA_DB_PATH=/app/data/tuya.db
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
